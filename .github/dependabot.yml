# Weekly pull requests that update the CI actions (pinned by SHA) and uv.lock.
# The cooldown skips releases younger than a week; security updates are not delayed.
# Not covered: the frontend libraries loaded from the CDN in index.html and the Tailwind CLI
# pinned in scripts/build_css.py.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]
