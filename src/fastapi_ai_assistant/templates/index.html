<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Chat App</title>
  <!-- Markdown, math and HTML sanitizing for the replies. Exact versions with SRI hashes:
       the browser refuses a file that differs from the one reviewed. Every script and style
       carries this response's nonce: the page's Content Security Policy blocks any other. -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.css"
    integrity="sha384-lPx0C4zIUZLpveABMwOFcFeGZwsvKBJfhJ85FN1PYOV7xApBcFMhcAEMVKF8loOI"
    crossorigin="anonymous"
    nonce="{{ csp_nonce }}"
  />
  <script
    src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"
    integrity="sha384-2vpGtuKqJvFlwJqYnf/wUMuzUfhUnYBt9oay0e2yaFcq0Dh6/aEbQ8YAOeKGzlYo"
    crossorigin="anonymous"
    nonce="{{ csp_nonce }}"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.js"
    integrity="sha384-19KE2cFb3U+RUWmyhBz7aLOGDG8WrRC6hE3oY/HTZZlAAVWYTdmvLC//+TIV3zUx"
    crossorigin="anonymous"
    nonce="{{ csp_nonce }}"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"
    integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL"
    crossorigin="anonymous"
    nonce="{{ csp_nonce }}"
  ></script>
  <!-- Alpine.js, CSP build: it runs the template's expressions without eval() -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/@alpinejs/csp@3.17.4/dist/cdn.min.js"
    integrity="sha384-DQd2BgbtOQrdt/JbxcM+wSb8poOHwsG5W2jbbXskj85r7SWPwqpBFgGGR1devM/D"
    crossorigin="anonymous"
    nonce="{{ csp_nonce }}"
  ></script>
  <style nonce="{{ csp_nonce }}">
    /* Plain CSS, so the page loads no stylesheet code from third parties.
       The base rules give every browser the same starting point. */
    *, *::before, *::after { box-sizing: border-box; }
    html {
      font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
        "Segoe UI Symbol", "Noto Color Emoji";
      line-height: 1.5;
    }
    body { margin: 0; padding: 2.5rem 0; background: #f3f4f6; }
    button, input { margin: 0; font: inherit; color: inherit; }
    button { border: 0; cursor: pointer; }
    button:disabled { cursor: default; }

    /* Chat card and messages */
    .chat {
      max-width: 42rem; margin: 0 auto; padding: 1rem; background: #fff; border-radius: 0.25rem;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }
    .title { margin: 0 0 1rem; font-size: 1.5rem; line-height: 2rem; font-weight: 700; }
    .messages { max-height: 24rem; overflow-y: auto; margin-bottom: 1rem; }
    .message { margin-top: 0.5rem; }
    .message.from-user { text-align: right; }
    .bubble {
      display: inline-block; max-width: 100%; padding: 0.5rem 0.75rem; border-radius: 0.25rem;
      text-align: left; background: #e5e7eb; color: #374151;
      overflow-wrap: anywhere;  /* Long words and links wrap instead of overflowing */
    }
    .from-user .bubble { background: #dbeafe; color: #1d4ed8; }
    .user-text { white-space: pre-wrap; }
    /* Read by screen readers, but not shown */
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    /* Message box and buttons. Text keeps the 4.5:1 contrast that WCAG AA asks for,
       and the box's border the 3:1 asked for the outline of controls. */
    .composer { display: flex; align-items: center; gap: 0.5rem; }
    .composer input {
      width: 100%; padding: 0.25rem 0.5rem; border: 1px solid #6b7280; border-radius: 0.25rem;
    }
    .composer input::placeholder { color: #6b7280; opacity: 1; }
    .composer button { padding: 0.5rem 1rem; border-radius: 0.25rem; color: #fff; }
    .send { background: #2563eb; }
    .send:hover:not(:disabled) { background: #1d4ed8; }
    .send:disabled { opacity: 0.6; }  /* Shows that it can't be used while a reply streams */
    .stop { background: #dc2626; }
    .stop:hover { background: #b91c1c; }

    /* Replies rendered from Markdown */
    .markdown :is(p, h1, h2, h3, h4, h5, h6, ul, ol, pre, blockquote, table, hr) { margin: 0; }
    .markdown > :not(:first-child) { margin-top: 0.5rem; }
    .markdown :is(h1, h2, h3, h4, h5, h6) { font-size: inherit; font-weight: 600; }
    .markdown :is(ul, ol) { padding-left: 1.25rem; }
    .markdown a { color: #1d4ed8; text-decoration: underline; }
    .markdown :is(code, pre) {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
        "Courier New", monospace;
      font-size: 1em;
    }
    .markdown code { background: rgba(0, 0, 0, 0.07); border-radius: 0.25rem; padding: 0 0.25rem; }
    .markdown pre {
      background: #1f2937; color: #f9fafb; border-radius: 0.375rem; padding: 0.5rem 0.75rem;
      overflow-x: auto;
    }
    .markdown pre code { background: none; padding: 0; }
    .markdown blockquote { border-left: 3px solid #d1d5db; padding-left: 0.75rem; }
    .markdown table { border-collapse: collapse; }
    .markdown :is(th, td) { border: 1px solid #d1d5db; padding: 0.125rem 0.5rem; }
    .markdown hr { border: 0; border-top: 1px solid #d1d5db; }
    .markdown .katex-display { overflow-x: auto; overflow-y: hidden; }
  </style>
</head>
<body>
  <main class="chat" x-data="chatApp">
    <h1 class="title">AI Chat</h1>

    <!-- The conversation messages. Not a live region: screen readers would read every token
         as it streams in, so each reply is announced once it's complete (see the next div).
         tabindex lets keyboard users focus the log to scroll it. -->
    <div class="messages" role="log" aria-label="Conversation" aria-live="off" tabindex="0">
      <template x-for="(msg, idx) in messages" :key="idx">
        <div class="message" :class="{ 'from-user': msg.sender === 'user' }">
          <div class="bubble">
            <!-- The user's text is shown as typed; replies are rendered as Markdown + math -->
            <template x-if="msg.sender === 'user'">
              <span class="user-text" x-text="msg.text"></span>
            </template>
            <template x-if="msg.sender === 'assistant'">
              <div class="markdown" x-markdown="msg.text"></div>
            </template>
          </div>
        </div>
      </template>
    </div>
    <div class="visually-hidden" aria-live="polite" x-ref="announcer"></div>

    <!-- Input and buttons area -->
    <form @submit.prevent="sendMessage" class="composer">
      <!-- The placeholder disappears while typing, so the box needs a real label -->
      <label for="message" class="visually-hidden">Message</label>
      <input
        id="message"
        x-ref="message"
        x-model="newMessage"
        type="text"
        placeholder="Type your message..."
        maxlength="{{ max_prompt_chars }}"
        :disabled="streaming"
      /> <!-- Optionally disable while streaming -->
      <button
        type="submit"
        class="send"
        :disabled="streaming"
      >
        Send
      </button>
      <!-- Stop button -->
      <button
        type="button"
        class="stop"
        x-show="streaming"
        @click="stopStreaming"
      >
        Stop
      </button>
    </form>
  </main>

  <script nonce="{{ csp_nonce }}">
    // Replies come from the model, so they are untrusted HTML. Math is cut out first and
    // rendered by KaTeX after sanitizing: KaTeX needs inline styles, the model's HTML gets none.
    const MATH_DELIMITERS = [
      ["$$", "$$", true],
      ["\\[", "\\]", true],
      ["\\(", "\\)", false],
      ["$", "$", false],
    ];
    const MATH_MARK = `math-${Math.random().toString(36).slice(2)}-`;  // Unguessable placeholder
    let formulas = [];

    marked.use({
      breaks: true,  // A single newline is a line break, as people expect in a chat
      extensions: [{
        name: "math",
        level: "inline",
        start: (src) => src.match(/\$|\\[[(]/)?.index,
        tokenizer(src) {
          for (const [open, close, display] of MATH_DELIMITERS) {
            if (!src.startsWith(open)) continue;
            const end = src.indexOf(close, open.length);
            const tex = src.slice(open.length, end);
            // Not closed yet (still streaming), empty, or prices like "$5 and $6".
            if (end < 0 || !tex.trim() || (open === "$" && /^\s|\s$/.test(tex))) continue;
            return { type: "math", raw: src.slice(0, end + close.length), tex, display };
          }
        },
        renderer: (token) => `${MATH_MARK}${formulas.push(token) - 1}-`,
      }],
    });

    // Only the tags Markdown produces. No images or styles (they could leak the chat to
    // other sites), no classes, and no Alpine attributes (x-*, @, :), which Alpine would run.
    const SANITIZE_OPTIONS = {
      ALLOWED_TAGS: [
        "p", "br", "hr", "h1", "h2", "h3", "h4", "h5", "h6", "strong", "em", "del", "code",
        "pre", "blockquote", "ul", "ol", "li", "a", "table", "thead", "tbody", "tr", "th", "td",
      ],
      ALLOWED_ATTR: ["href", "title", "start", "align"],
      ALLOW_DATA_ATTR: false,
      ALLOW_ARIA_ATTR: false,
    };
    DOMPurify.addHook("afterSanitizeAttributes", (node) => {
      if (node.tagName === "A") {
        node.setAttribute("target", "_blank");  // Opening a link must not close the chat
        node.setAttribute("rel", "noopener noreferrer");
      }
    });

    function renderMarkdown(text) {
      formulas = [];
      const html = DOMPurify.sanitize(marked.parse(text), SANITIZE_OPTIONS);
      return html.replace(new RegExp(`${MATH_MARK}(\\d+)-`, "g"), (_, i) =>
        katex.renderToString(formulas[i].tex, {
          displayMode: formulas[i].display,
          throwOnError: false,  // Show invalid TeX as text instead of failing
        })
      );
    }

    // Reads a fetch() response body as Server-Sent Events and yields { type, data } for each.
    // (EventSource does this by itself, but it can only send GET requests.)
    async function* readServerSentEvents(body) {
      const reader = body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = "";
      let type = "message";
      let data = [];
      for (;;) {
        const { value, done } = await reader.read();
        if (done) return;
        buffer += value;
        // Lines end with \r\n, \n or \r. A \r at the very end may be half of a \r\n: wait for more.
        const lines = buffer.split(/\r\n|\n|\r(?!$)/);
        buffer = lines.pop();
        for (const line of lines) {
          if (line === "") {  // A blank line ends the event
            if (data.length) yield { type, data: data.join("\n") };
            type = "message";
            data = [];
          } else if (line.startsWith("data:")) {
            data.push(line.slice(5).replace(/^ /, ""));
          } else if (line.startsWith("event:")) {
            type = line.slice(6).replace(/^ /, "");
          }
        }
      }
    }

    function chatApp() {
      return {
        messages: [],
        newMessage: "",
        currentRequest: null,  // AbortController of the reply being streamed
        streaming: false,
        conversationId: null,  // Sent by the server with the first reply

        async sendMessage() {
          const prompt = this.newMessage.trim();
          if (!prompt) return;

          // 1) Push the user's message to the list
          this.messages.push({ sender: "user", text: prompt });
          this.newMessage = "";
          this.streaming = true;
          this.currentRequest = new AbortController();
          this.$refs.announcer.replaceChildren();

          // The assistant's message, created when the first text arrives
          let reply = null;
          const show = (text) => {
            if (reply === null) {
              reply = this.messages[this.messages.push({ sender: "assistant", text: "" }) - 1];
            }
            reply.text += text;
          };

          try {
            // 2) POST the message (in the body, so it stays out of URLs and logs)
            //    and read the reply while it streams in
            const response = await fetch(`{{ root_prefix }}/chat-stream`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ prompt, conversation_id: this.conversationId }),
              signal: this.currentRequest.signal,
            });
            if (!response.ok) {  // E.g. the message limit (429)
              const error = await response.json().catch(() => ({}));
              show(`[Error: ${typeof error.detail === "string" ? error.detail : `HTTP ${response.status}`}]`);
              return;
            }
            for await (const event of readServerSentEvents(response.body)) {
              if (event.type === "conversation") {
                // The first reply starts a conversation: keep its id for the next messages
                this.conversationId = event.data;
              } else if (event.data === "[DONE]") {
                break;
              } else {
                show(event.data);
              }
            }
          } catch (error) {
            if (error.name !== "AbortError") {  // Stop aborts on purpose
              console.error("Chat request failed:", error);
              show("\n[Error: could not reach the server.]");
            }
          } finally {
            this.currentRequest = null;
            this.streaming = false;
            this.$nextTick(() => {
              // Screen readers read the finished (or stopped) reply once, as rendered
              const rendered = this.$root.querySelector(".message:last-of-type .markdown");
              if (reply && rendered) {
                this.$refs.announcer.replaceChildren(...rendered.cloneNode(true).childNodes);
              }
              // Disabling the message box (or hiding Stop) took the focus: give it back to
              // the box, unless the user has moved on to something else on the page
              const focused = document.activeElement;
              if (focused === document.body || this.$refs.message.form.contains(focused)) {
                this.$refs.message.focus();
              }
            });
          }
        },

        stopStreaming() {
          // Closing the connection makes the server stop asking OpenAI too
          this.currentRequest?.abort();
        },
      };
    }

    document.addEventListener("alpine:init", () => {
      // x-markdown="text" shows the text as sanitized Markdown + math, again whenever it
      // changes. Alpine's CSP build forbids x-html, which would insert any HTML at all.
      Alpine.directive("markdown", (el, { expression }, { effect, evaluateLater }) => {
        const getText = evaluateLater(expression);
        effect(() => getText((text) => { el.innerHTML = renderMarkdown(text); }));
      });
      // The CSP build only knows components registered by name
      Alpine.data("chatApp", chatApp);
    });
  </script>
</body>
</html>
