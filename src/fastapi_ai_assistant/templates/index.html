<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Chat App</title>
  <!-- TailwindCSS (CDN for demo) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Markdown, math and HTML sanitizing for the replies. Exact versions with SRI hashes:
       the browser refuses a file that differs from the one reviewed. -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.css"
    integrity="sha384-lPx0C4zIUZLpveABMwOFcFeGZwsvKBJfhJ85FN1PYOV7xApBcFMhcAEMVKF8loOI"
    crossorigin="anonymous"
  />
  <script
    src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"
    integrity="sha384-2vpGtuKqJvFlwJqYnf/wUMuzUfhUnYBt9oay0e2yaFcq0Dh6/aEbQ8YAOeKGzlYo"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.js"
    integrity="sha384-19KE2cFb3U+RUWmyhBz7aLOGDG8WrRC6hE3oY/HTZZlAAVWYTdmvLC//+TIV3zUx"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"
    integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL"
    crossorigin="anonymous"
  ></script>
  <!-- Alpine.js -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"
    integrity="sha384-5/joNqFnRyVWzXp99bHot6RHG+EksGp+USSgZwPar7T9SD9PKKER37n/8bXBAZGd"
    crossorigin="anonymous"
  ></script>
  <style>
    /* Tailwind's reset strips the default look of Markdown; bring back the basics. */
    .markdown > * + * { margin-top: 0.5rem; }
    .markdown ul { list-style: disc; padding-left: 1.25rem; }
    .markdown ol { list-style: decimal; padding-left: 1.25rem; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 { font-weight: 600; }
    .markdown a { color: #2563eb; text-decoration: underline; }
    .markdown code { background: rgba(0, 0, 0, 0.07); border-radius: 0.25rem; padding: 0 0.25rem; }
    .markdown pre { background: #1f2937; color: #f9fafb; border-radius: 0.375rem; padding: 0.5rem 0.75rem; overflow-x: auto; }
    .markdown pre code { background: none; padding: 0; }
    .markdown blockquote { border-left: 3px solid #d1d5db; padding-left: 0.75rem; }
    .markdown th, .markdown td { border: 1px solid #d1d5db; padding: 0.125rem 0.5rem; }
    .markdown .katex-display { overflow-x: auto; overflow-y: hidden; }
  </style>
</head>
<body class="bg-gray-100 py-10">
  <div class="max-w-2xl mx-auto p-4 bg-white rounded shadow" x-data="chatApp()">
    <h1 class="text-2xl font-bold mb-4">AI Chat</h1>

    <!-- The conversation messages -->
    <div class="space-y-2 mb-4 max-h-96 overflow-y-auto">
      <template x-for="(msg, idx) in messages" :key="idx">
        <div
          :class="msg.sender === 'user' ? 'text-right' : 'text-left'"
        >
          <div
            class="inline-block max-w-full px-3 py-2 rounded text-left"
            :class="msg.sender === 'user'
              ? 'bg-blue-100 text-blue-700'
              : 'bg-gray-200 text-gray-700'"
          >
            <!-- The user's text is shown as typed; replies are rendered as Markdown + math -->
            <template x-if="msg.sender === 'user'">
              <span class="whitespace-pre-wrap" x-text="msg.text"></span>
            </template>
            <template x-if="msg.sender === 'assistant'">
              <div class="markdown" x-html="renderMarkdown(msg.text)"></div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- Input and buttons area -->
    <form @submit.prevent="sendMessage" class="flex items-center space-x-2">
      <input
        x-model="newMessage"
        type="text"
        class="border border-gray-300 rounded px-2 py-1 w-full"
        placeholder="Type your message..."
        maxlength="{{ max_prompt_chars }}"
        :disabled="streaming"
      /> <!-- Optionally disable while streaming -->
      <button
        type="submit"
        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
        :disabled="streaming"
      >
        Send
      </button>
      <!-- Stop button -->
      <button
        type="button"
        class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"
        x-show="streaming"
        @click="stopStreaming"
      >
        Stop
      </button>
    </form>
  </div>

  <script>
    // Replies come from the model, so they are untrusted HTML. Math is cut out first and
    // rendered by KaTeX after sanitizing: KaTeX needs inline styles, the model's HTML gets none.
    const MATH_DELIMITERS = [
      ["$$", "$$", true],
      ["\\[", "\\]", true],
      ["\\(", "\\)", false],
      ["$", "$", false],
    ];
    const MATH_MARK = `math-${Math.random().toString(36).slice(2)}-`;  // Unguessable placeholder
    let formulas = [];

    marked.use({
      breaks: true,  // A single newline is a line break, as people expect in a chat
      extensions: [{
        name: "math",
        level: "inline",
        start: (src) => src.match(/\$|\\[[(]/)?.index,
        tokenizer(src) {
          for (const [open, close, display] of MATH_DELIMITERS) {
            if (!src.startsWith(open)) continue;
            const end = src.indexOf(close, open.length);
            const tex = src.slice(open.length, end);
            // Not closed yet (still streaming), empty, or prices like "$5 and $6".
            if (end < 0 || !tex.trim() || (open === "$" && /^\s|\s$/.test(tex))) continue;
            return { type: "math", raw: src.slice(0, end + close.length), tex, display };
          }
        },
        renderer: (token) => `${MATH_MARK}${formulas.push(token) - 1}-`,
      }],
    });

    // Only the tags Markdown produces. No images or styles (they could leak the chat to
    // other sites), no classes, and no Alpine attributes (x-*, @, :), which Alpine would run.
    const SANITIZE_OPTIONS = {
      ALLOWED_TAGS: [
        "p", "br", "hr", "h1", "h2", "h3", "h4", "h5", "h6", "strong", "em", "del", "code",
        "pre", "blockquote", "ul", "ol", "li", "a", "table", "thead", "tbody", "tr", "th", "td",
      ],
      ALLOWED_ATTR: ["href", "title", "start", "align"],
      ALLOW_DATA_ATTR: false,
      ALLOW_ARIA_ATTR: false,
    };
    DOMPurify.addHook("afterSanitizeAttributes", (node) => {
      if (node.tagName === "A") {
        node.setAttribute("target", "_blank");  // Opening a link must not close the chat
        node.setAttribute("rel", "noopener noreferrer");
      }
    });

    function renderMarkdown(text) {
      formulas = [];
      const html = DOMPurify.sanitize(marked.parse(text), SANITIZE_OPTIONS);
      return html.replace(new RegExp(`${MATH_MARK}(\\d+)-`, "g"), (_, i) =>
        katex.renderToString(formulas[i].tex, {
          displayMode: formulas[i].display,
          throwOnError: false,  // Show invalid TeX as text instead of failing
        })
      );
    }

    function chatApp() {
      return {
        messages: [],
        newMessage: "",
        currentEventSource: null,
        streaming: false,
        conversationId: null,  // Sent by the server with the first reply

        async sendMessage() {
          const prompt = this.newMessage.trim();
          if (!prompt) return;

          // 1) Push the user's message to the list
          this.messages.push({ sender: "user", text: prompt });
          this.newMessage = "";

          // 2) Create an SSE connection (continuing our conversation, if any)
          let url = `{{ root_prefix }}/chat-stream?prompt=${encodeURIComponent(prompt)}`;
          if (this.conversationId) {
            url += `&conversation_id=${encodeURIComponent(this.conversationId)}`;
          }
          const eventSource = new EventSource(url);

          this.currentEventSource = eventSource;
          this.streaming = true;

          // The first reply starts a conversation: keep its id for the next messages
          eventSource.addEventListener("conversation", (event) => {
            this.conversationId = event.data;
          });

          // We'll store the partial response for the assistant here
          let assistantIndex = null;

          eventSource.onmessage = (event) => {
            const chunk = event.data;

            // If the chunk is "[DONE]", close the SSE stream
            if (chunk === "[DONE]") {
              this.stopStreaming();  // close and reset
              return;
            }

            // If we haven't created an "assistant" message yet, do so now
            if (assistantIndex === null) {
              assistantIndex = this.messages.push({
                sender: "assistant",
                text: ""
              }) - 1; // store the new message's index
            }

            // Append the chunk to the assistant's text
            this.messages[assistantIndex].text += chunk;
          };

          eventSource.onerror = (error) => {
            console.error("SSE error:", error);
            this.stopStreaming();
          };
        },

        stopStreaming() {
          if (this.currentEventSource) {
            this.currentEventSource.close();
            this.currentEventSource = null;
          }
          this.streaming = false;
        },
      };
    }
  </script>
</body>
</html>
