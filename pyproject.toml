[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-ai-assistant"
version = "0.1.0"
description = "FastAPI application demonstrating the OpenAI Responses API with real-time streaming"
readme = "README.md"
requires-python = ">=3.11"

license = "MIT"
license-files = ["LICENSE"]

authors = [
    {name = "Carlos A. Planchón", email = "carlosandresplanchonprestes@gmail.com"}
]
keywords = ["fastapi", "openai", "responses-api", "ai", "chat", "sse", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "sse-starlette",
    "openai>=1.101",  # First release with the Conversations API.
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx2",  # HTTP client used by the tests.
    "pytest-playwright",  # Browser tests (pytest -m ui).
    "black",
    "ruff",
    "mypy",
]

[project.urls]
Repository = "https://github.com/carlosplanchon/fastapi-ai-assistant"

[project.scripts]
fastapi-ai-assistant = "fastapi_ai_assistant.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastapi_ai_assistant = ["templates/*.html", "static/*.css"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313", "py314", "py315"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Browser tests need Chromium (`playwright install chromium`), so they only run with -m ui.
addopts = "-v --cov=src --cov-report=term-missing -m 'not ui'"
markers = ["ui: drives the chat page in a real browser (run with: pytest -m ui)"]
